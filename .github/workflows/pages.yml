name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Leftovers from other builders break the TanStack Start build: a root
      # index.html makes the output the unbuilt template (blank page).
      - name: Remove files that break the build
        run: |
          rm -rf .vercel .output dist pages-out
          rm -f index.html src/main.tsx src/client.tsx Dashboard.tsx PATCH-INSTRUCTIONS.md
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The checked-in lockfile currently misses nested AJV dependency records.
      # npm install reconciles that stale lock on the clean runner; npm ci would
      # fail before Vite even starts (see the repository's former Actions logs).
      - run: npm install --no-audit --no-fund
      - name: Pages base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          PAGES_BASE: ${{ steps.base.outputs.path }}
      - name: Collect the static site
        env:
          PAGES_BASE: ${{ steps.base.outputs.path }}
        run: |
          mkdir -p pages-out
          cp -a .vercel/output/static/. pages-out/
          if [ -f pages-out/_shell.html ]; then
            cp pages-out/_shell.html pages-out/index.html
          fi
          if [ ! -f pages-out/index.html ]; then
            echo "No index.html was produced" >&2
            exit 1
          fi
          # The prerendered shell can contain root-relative URLs such as
          # /assets/app.js. Put the Pages base in front of them, once.
          if [ "${PAGES_BASE}" != "/" ]; then
            python3 - <<'PY'
          import os, pathlib, re
          base = os.environ["PAGES_BASE"]
          p = pathlib.Path("pages-out/index.html")
          s = p.read_text(encoding="utf-8")
          pat = re.compile(r"""(["'(])/(assets/|__grok/|favicon\.svg|manifest\.webmanifest|og\.jpg|sw\.js)""")
          p.write_text(pat.sub(lambda m: m.group(1) + base + m.group(2), s), encoding="utf-8")
          PY
          fi
          if [ ! -f pages-out/manifest.webmanifest ] || [ ! -f pages-out/sw.js ]; then
            echo "Static PWA manifest or service worker is missing from the build" >&2
            exit 1
          fi
          if grep -q "/src/main.tsx" pages-out/index.html; then
            echo "index.html is the unbuilt template, not the app" >&2
            exit 1
          fi
          touch pages-out/.nojekyll
          if [ "${PAGES_BASE}" != "/" ] && grep -Eq '(src|href)="/(assets|favicon\.svg|manifest\.webmanifest|__grok)/' pages-out/index.html; then
            echo "Found root-relative asset URLs that break on GitHub Pages project sites" >&2
            grep -Eo '(src|href)="/(assets|__grok)/[^"]*"' pages-out/index.html | head -5 >&2
            exit 1
          fi
          cp pages-out/index.html pages-out/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
